# Publish to npm with provenance via trusted publishing (OIDC) on tag push.
#
# One-time setup on npmjs.com (package → Settings → Trusted Publisher):
#   Organization or user: saaranshM        (exact GitHub login casing)
#   Repository:           unsnooze
#   Workflow filename:    release.yml      (filename only, no path)
#   Environment name:     (leave blank)
# The repo must be public. No NPM_TOKEN secret is used — OIDC is the auth.
#
# Release: bump version + CHANGELOG, commit, then
#   git tag v<version> && git push origin v<version>

name: Release

on:
  push:
    tags:
      - "v*"

# Least privilege: only the publish job gets id-token (OIDC/provenance).
permissions:
  contents: read

jobs:
  # The same matrix CI runs on every push — Ubuntu and macOS on Node 20 and 22,
  # plus Windows on 22. This job used to be a cut-down ubuntu/Node-22 run, which
  # is how 1.14.3 published while Windows was failing. Gate and branch checks
  # now share one definition in test.yml.
  test:
    uses: ./.github/workflows/test.yml

  # Keep this job HERE, in release.yml. npm's trusted publisher is matched on
  # the workflow filename, so moving publish into a reusable workflow changes
  # the OIDC claim and the publish is rejected. Only the test gate is shared.
  publish:
    needs: test
    runs-on: ubuntu-latest   # must be GitHub-hosted for provenance
    permissions:
      # write, not read: the last step creates the GitHub release for the tag.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing needs npm >= 11.5.1; setup-node ships an older npm.
      # Pinned (not @latest): this job holds the OIDC publish credential —
      # bump the pin deliberately, never float it.
      - run: npm install -g npm@11.5.1
      - run: npm ci
      # No NODE_AUTH_TOKEN: OIDC auth is automatic. --provenance kept explicit —
      # docs claim it is implied under trusted publishing, but real-world
      # publishes still needed the flag as of 2026.
      - run: npm publish --provenance --access public
      # `npm publish` returns before the version is readable: it answers "your
      # package is being processed and may take a few minutes to become
      # available". The website's changelog asks the registry which version is
      # latest and hides anything newer, so firing the rebuild straight after
      # the publish rebuilt the site against the PREVIOUS latest and froze the
      # new release out of it — that is exactly what happened on 1.16.2. Wait
      # for the registry to actually serve it first.
      - name: Wait for the registry to serve the published version
        run: |
          version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 40); do
            latest="$(curl -sf -H 'Accept: application/vnd.npm.install-v1+json' \
              https://registry.npmjs.org/unsnooze | node -p \
              "JSON.parse(require('fs').readFileSync(0,'utf8'))['dist-tags'].latest" || true)"
            if [ "$latest" = "$version" ]; then
              echo "registry serves $version after ${attempt} check(s)"
              exit 0
            fi
            sleep 15
          done
          echo "registry still reports '$latest' after 10 minutes, not '$version'" >&2
          exit 1
      # The static changelog only exposes versions that npm confirms as shipped.
      # Rebuild after publish so Vercel cannot win the race and freeze the old latest.
      - name: Rebuild website changelog
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST --output /dev/null "${VERCEL_DEPLOY_HOOK}?buildCache=false"
      # GitHub Releases used to be written by hand after the fact, so a release
      # that npm and the website both had could still be missing from the repo's
      # Releases tab — 1.16.2 was. The notes are the version's CHANGELOG section;
      # edit the release afterwards when it deserves more.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/release-notes.mjs "$version" > release-notes.md
          if gh release view "v$version" >/dev/null 2>&1; then
            gh release edit "v$version" --notes-file release-notes.md
          else
            gh release create "v$version" --title "v$version" --notes-file release-notes.md --verify-tag
          fi
